<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato — Entrega 2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Formulário de contato</h1>
      <p>Dados fictícios — envio simulado</p>
    </header>

    <main>
      <form action="#" method="post">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" placeholder="Seu nome" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="seu@email.com" required>

        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" placeholder="(34) 9xxxx-xxxx">

        <fieldset>
          <legend>Você é recrutador?</legend>
          <label><input type="radio" name="recrutador" value="sim"> Sim</label>
          <label><input type="radio" name="recrutador" value="nao" checked> Não</label>
        </fieldset>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="6" placeholder="Escreva sua mensagem"></textarea>

        <button type="submit">Enviar</button>
      </form>

      <p class="back-link"><a href="index.html">← Voltar à página principal</a></p>
    </main>

    <footer>
      <p>© João Guilherme — 2025</p>
    </footer>
  </div>
</body>
</html>
